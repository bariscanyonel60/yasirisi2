<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Yalçın Isı form detection</title>
  </head>
  <body>
    <!-- Netlify Forms build-time detection (Next.js SSR) -->
    <form
      name="teklif"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="teklif" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="product" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="kvkk" />
    </form>
  </body>
</html>
